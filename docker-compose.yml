version: "3.8"

services:
  spectre:
    build: .
    container_name: spectre
    restart: unless-stopped
    # Published port is overridable because 8000 is one of the most contested
    # ports on a workstation. Set SPECTRE_API_PORT to move it; leave unset for
    # the 8000 default. scripts/spectre-api.service is the systemd equivalent
    # and reads the same variable name.
    ports:
      - "${SPECTRE_API_PORT:-8000}:8000"
    volumes:
      - spectre-config:/root/.config/spectre
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - SPECTRE_PROFILE=production
      - SPECTRE_LOG_LEVEL=INFO
      # Required. The API refuses to serve unauthenticated; fail fast at up
      # rather than starting an open control surface on the published port.
      - SPECTRE_API_KEY=${SPECTRE_API_KEY:?set SPECTRE_API_KEY in your environment or .env}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"X-API-Key: $$SPECTRE_API_KEY\" http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  spectre-config:
