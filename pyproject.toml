[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectre"
version = "0.3.0"
description = "Spectre - Autonomous AI Engineering Operating System for Fedora Linux"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Spectre Contributors"},
]
keywords = ["linux", "automation", "ai", "engineering", "operations", "fedora", "security", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=14.2.0",
    "pydantic>=2.7.0",
    "sqlmodel>=0.0.19",
    "psutil>=5.9.0",
    "aiofiles>=23.2.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "pyyaml>=6.0.0",
    "watchdog>=4.0.0",
    "gitpython>=3.1.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "textual>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "types-PyYAML>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/bigwalkdoe/spectre-system-maintenance-agent"
Documentation = "https://github.com/bigwalkdoe/spectre-system-maintenance-agent/tree/main/docs"
Repository = "https://github.com/bigwalkdoe/spectre-system-maintenance-agent"
Issues = "https://github.com/bigwalkdoe/spectre-system-maintenance-agent/issues"
Changelog = "https://github.com/bigwalkdoe/spectre-system-maintenance-agent/releases"

[project.scripts]
spectre = "apps.cli.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_return_any = false
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["packages", "apps"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "pass",
]
