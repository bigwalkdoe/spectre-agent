[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectre-agent"
version = "0.2.0"
description = "Deployment orchestrator for containerized services"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]

[project.scripts]
spectre = "spectre.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/spectre"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_return_any = false
disallow_untyped_defs = true
