name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
        run: |
          echo "Deploying ${{ github.ref_name }} to ${{ vars.DEPLOY_TARGET || 'staging' }}"
          # ./scripts/deploy.sh ${{ github.sha }} ${{ vars.DEPLOY_TARGET || 'staging' }}
