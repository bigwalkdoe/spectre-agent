name: CI/CD Pipeline

on:
  # Lint/test/build ran only against main, so nothing on a feature branch was
  # ever verified before merge -- including the dashboard JavaScript syntax
  # check. Run them on every branch push; the release trigger is unchanged.
  push:
  pull_request:
  release:
    types: [published]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check packages apps tests
      - name: Ruff format check
        run: ruff format --check packages apps tests
      - name: Mypy type check
        run: mypy packages apps --ignore-missing-imports
      - name: API docs match the code
        # Both AGENTS.md and README.md publish an endpoint table and an exact CLI
        # command count. Nothing checked them: the tables were missing `GET /`
        # and named two path parameters differently from the routes, and the
        # count was off by one.
        run: python scripts/check-api-docs.py

      - name: Dashboard JavaScript syntax
        # DASHBOARD_HTML is a Python string literal that ships to the browser.
        # A `# noqa: E501` once sat inside it; `#` is not a JS comment, so the
        # whole script block became a SyntaxError and the dashboard rendered
        # "Loading..." forever. Ruff cannot see inside the string, so parse the
        # extracted script instead.
        run: |
          python - <<'PY' > /tmp/dashboard.js
          import re
          src = open("apps/api/main.py", encoding="utf-8").read()
          html = re.search(r'DASHBOARD_HTML = """(.*?)"""', src, re.S).group(1)
          script = re.search(r"<script>(.*?)</script>", html, re.S)
          if not script:
              raise SystemExit("no <script> block found in DASHBOARD_HTML")
          print(script.group(1))
          PY
          node --check /tmp/dashboard.js
          echo "dashboard JS parses"

  test:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v --tb=short -x --timeout=600

  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: pip install build twine
      - name: Build
        run: python -m build
      - name: Verify package
        run: twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: spectre:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max